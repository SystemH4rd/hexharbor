name: Publish HexHarbor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test behavior
        run: npm test
      - name: Verify static files and demo data
        run: npm run check
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

